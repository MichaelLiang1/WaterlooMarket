# Calls /api/cron/daily once a day: listing-expiry reminders, completing
# finished rentals (unlocks reviews), cancelling stale requests, cleanup.
#
# Setup (repo → Settings → Secrets and variables → Actions):
#   Variables: APP_URL      e.g. https://waterloomarket.ca
#   Secrets:   CRON_SECRET  same value as the app's CRON_SECRET env var
#
# Run it by hand from the Actions tab ("Run workflow") to test.
name: Daily jobs

on:
  schedule:
    # 13:00 UTC = 9am Toronto in summer (EDT), 8am in winter (EST).
    # GitHub may start scheduled runs a few minutes late.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/daily
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL repository variable and the CRON_SECRET secret."
            exit 1
          fi
          # Retries only transient failures (timeouts, 5xx, app restarting); the
          # jobs are idempotent, so that's safe. A 401 (wrong secret) fails at once.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-connrefused --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/daily"
          echo
